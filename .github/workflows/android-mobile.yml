name: Android Mobile
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test local readiness rules
        run: |
          mkdir -p /tmp/arvertes-mobile-test
          javac --release 17 -encoding UTF-8 -d /tmp/arvertes-mobile-test mobile/app/src/main/java/com/arvertes/mobile/Readiness.java mobile/tests/ReadinessTest.java
          java -cp /tmp/arvertes-mobile-test com.arvertes.mobile.ReadinessTest
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Build debug APK
        run: gradle -p mobile --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arvertes-mobile-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
