name: Studio Web preview
on:
  pull_request:
    paths:
      - 'web/**'
      - 'office_habblaud/**'
      - 'netlify.toml'
      - 'vercel.json'
      - '.github/workflows/studio-web.yml'
permissions:
  contents: read
jobs:
  browser-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test the Studio Web distribution
        run: bash web/build-netlify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arvertes-studio-web-preview
          path: web/dist
          if-no-files-found: error
          retention-days: 14
