plugins {
    id 'com.android.application'
}
android {
    namespace 'com.arvertes.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.arvertes.mobile'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.1.3-dev'
        resValue 'string', 'app_name', 'Arvertes Mobile'
        testInstrumentationRunner 'com.arvertes.mobile.LocalSessionTest'
    }
    buildTypes {
        debug {
            if (project.hasProperty('parallelInstall')) {
                applicationIdSuffix '.stage3'
                resValue 'string', 'app_name', 'Arvertes Mobile · Etapa 3'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
