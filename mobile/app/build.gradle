plugins {
    id 'com.android.application'
}
android {
    namespace 'com.arvertes.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.arvertes.mobile'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.1.1-dev'
        testInstrumentationRunner 'com.arvertes.mobile.LocalSessionTest'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
